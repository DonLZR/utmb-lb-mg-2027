<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Générateur d'empreinte – code d'accès</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:3rem auto;padding:0 1rem;color:#1f2a24}input,button{font-size:1rem;padding:.7rem;border-radius:10px;border:1px solid #c9b48f;width:100%;box-sizing:border-box;margin:.4rem 0}button{background:#24382c;color:#fff;cursor:pointer}code{display:block;word-break:break-all;background:#f6f1e7;padding:.8rem;border-radius:10px}</style></head>
<body><h2>🔐 Code d'accès du site</h2><p>1. Tape le code choisi (majuscules/minuscules indifférentes).<br>2. Copie l'empreinte dans <b>cles.js</b> → <code style="display:inline">accessCodeHash: "…"</code></p>
<input id="c" placeholder="Ton code d'accès"><button id="b" type="button">Générer l'empreinte</button><code id="o">—</code>
<script>document.getElementById('b').addEventListener('click',async()=>{const v=document.getElementById('c').value.trim().toUpperCase();if(!v)return;const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));document.getElementById('o').textContent=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');});</script></body></html>
